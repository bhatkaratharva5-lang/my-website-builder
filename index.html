<!DOCTYPE html>

  <style>
    /* Custom Neon Scrollbars */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 9999px; }

    /* Animated Cyber Neon Grid */
    .cyber-grid {
      background-size: 30px 30px;
      background-image: 
        linear-gradient(to right, rgba(6, 182, 212, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(168, 85, 247, 0.05) 1px, transparent 1px);
    }

    /* Ambient Pulsing Glow */
    @keyframes neon-pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    .neon-orb-cyan {
      animation: neon-pulse 6s ease-in-out infinite alternate;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.25) 0%, rgba(0,0,0,0) 70%);
      filter: blur(45px);
    }
    .neon-orb-purple {
      animation: neon-pulse 8s ease-in-out infinite alternate-reverse;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.25) 0%, rgba(0,0,0,0) 70%);
      filter: blur(50px);
    }

    /* Glassmorphism */
    .glass-panel {
      background: rgba(10, 10, 16, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Canvas Blocks */
    .canvas-block {
      position: relative;
      transition: all 0.2s ease;
    }
    .canvas-block:hover {
      outline: 2px dashed #06b6d4;
      outline-offset: -2px;
    }
    .canvas-block.selected {
      outline: 2px solid #a855f7 !important;
      outline-offset: -2px;
      box-shadow: inset 0 0 25px rgba(168, 85, 247, 0.2);
    }
    .block-toolbar {
      display: none;
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 40;
    }
    .canvas-block:hover .block-toolbar,
    .canvas-block.selected .block-toolbar {
      display: flex;
    }

    [contenteditable="true"]:focus {
      outline: 2px solid #06b6d4 !important;
      background: rgba(6, 182, 212, 0.1);
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
      border-radius: 4px;
    }

    /* Hide scrollbars on mobile horizontal action bar */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

              <div class="p-4 rounded-2xl bg-gradient-to-b from-purple-950/30 to-black border border-purple-500/50">
                <h3 class="text-xs font-bold text-purple-300" contenteditable="true">VIP PRO</h3>
                <div class="my-2"><span class="text-2xl font-black text-white">$9</span><span class="text-zinc-500 text-[10px]"> / MO</span></div>
                <button class="mt-4 w-full py-2 rounded-lg bg-gradient-to-r from-purple-500 to-pink-500 text-black font-black text-[10px]" contenteditable="true">UPGRADE</button>
              </div>
            </div>
          </div>
        `
      },
      footer: {
        type: 'footer',
        bg: 'bg-black',
        padding: 'py-6 px-4',
        html: `
          <div class="max-w-4xl mx-auto text-center text-[10px] text-zinc-500 font-mono border-t border-zinc-900 pt-4" contenteditable="true">
            © 2026 AURA NEON SYSTEMS. ALL RIGHTS RESERVED.
          </div>
        `
      }
    };

    function init() {
      insertSection('navbar');
      insertSection('hero');
      insertSection('features');
      insertSection('showcase');
      insertSection('footer');
      lucide.createIcons();
    }

    function toggleSectionMenu() {
      const drawer = document.getElementById('section-drawer');
      drawer.classList.toggle('hidden');
    }

    function insertSection(type) {
      const template = templates[type];
      if (!template) return;
      const id = 'sec_' + Date.now();
      blocks.push({ id, ...template });
      renderCanvas();
      selectBlock(id);
      document.getElementById('section-drawer').classList.add('hidden');
    }

    function renderCanvas() {
      const canvas = document.getElementById('canvas');
      canvas.innerHTML = '';

      if (blocks.length === 0) {
        canvas.innerHTML = `
          <div class="py-20 text-center">
            <i data-lucide="layers" class="w-8 h-8 mx-auto text-zinc-700 mb-2 animate-pulse"></i>
            <h3 class="text-xs font-bold text-zinc-400 uppercase">Canvas Empty</h3>
            <p class="text-[11px] text-zinc-600 mt-1">Tap 'SECTIONS' in top left to add blocks.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      blocks.forEach((block, index) => {
        const div = document.createElement('div');
        div.id = block.id;
        div.className = `canvas-block ${block.bg} ${block.padding} ${selectedBlockId === block.id && !isPreviewMode ? 'selected' : ''}`;
        div.onclick = (e) => {
          if (isPreviewMode) return;
          e.stopPropagation();
          selectBlock(block.id);
        };

        let toolbarHtml = '';
        if (!isPreviewMode) {
          toolbarHtml = `
            <div class="block-toolbar glass-panel rounded-lg shadow-xl p-1 flex items-center space-x-1 border border-zinc-700">
              <button onclick="moveBlock(${index}, -1, event)" class="p-1 hover:bg-zinc-800 text-zinc-300 rounded"><i data-lucide="chevron-up" class="w-3 h-3"></i></button>
              <button onclick="moveBlock(${index}, 1, event)" class="p-1 hover:bg-zinc-800 text-zinc-300 rounded"><i data-lucide="chevron-down" class="w-3 h-3"></i></button>
              <button onclick="deleteBlock(${index}, event)" class="p-1 hover:bg-rose-950 text-rose-400 rounded"><i data-lucide="trash" class="w-3 h-3"></i></button>
            </div>
          `;
        }

        div.innerHTML = toolbarHtml + block.html;
        canvas.appendChild(div);
      });

      lucide.createIcons();
    }

    function selectBlock(id) {
      selectedBlockId = id;
      const b = blocks.find(x => x.id === id);
      const inspector = document.getElementById('inspector-content');
      const mobileContent = document.getElementById('mobile-inspector-content');
      const badge = document.getElementById('selected-type-badge');
      const mobileBadge = document.getElementById('mobile-badge');

      if (!b) {
        badge.innerText = 'NONE';
        mobileBadge.innerText = 'NONE';
        inspector.innerHTML = `<p class="text-zinc-500 text-center py-10">Select a block.</p>`;
        mobileContent.innerHTML = `<p class="text-zinc-500 text-center py-4">Tap a block on screen.</p>`;
        renderCanvas();
        return;
      }

      badge.innerText = b.type.toUpperCase();
      mobileBadge.innerText = b.type.toUpperCase();

      const formHtml = `
        <div class="space-y-3">
          <div>
            <label class="block text-zinc-400 mb-1 text-[10px] font-bold uppercase">Background</label>
            <select onchange="updateBlockStyle('${b.id}', 'bg', this.value)" class="w-full bg-black border border-zinc-800 rounded-lg p-2 text-zinc-200">
              <option value="bg-black" ${b.bg === 'bg-black' ? 'selected' : ''}>Pure OLED Black</option>
              <option value="bg-zinc-950" ${b.bg === 'bg-zinc-950' ? 'selected' : ''}>Cyber Charcoal</option>
              <option value="bg-purple-950/30" ${b.bg.includes('purple-950') ? 'selected' : ''}>Deep Neon Violet</option>
              <option value="bg-cyan-950/30" ${b.bg.includes('cyan-950') ? 'selected' : ''}>Deep Neon Cyan</option>
            </select>
          </div>
          <div>
            <label class="block text-zinc-400 mb-1 text-[10px] font-bold uppercase">Padding</label>
            <select onchange="updateBlockStyle('${b.id}', 'padding', this.value)" class="w-full bg-black border border-zinc-800 rounded-lg p-2 text-zinc-200">
              <option value="py-6 px-4" ${b.padding.includes('py-6') ? 'selected' : ''}>Compact</option>
              <option value="py-12 px-4" ${b.padding.includes('py-12') ? 'selected' : ''}>Standard</option>
              <option value="py-20 px-4" ${b.padding.includes('py-20') ? 'selected' : ''}>Spacious</option>
            </select>
          </div>
          <p class="text-cyan-400 text-[10px]">💡 Tap headline or button text on canvas to type directly.</p>
        </div>
      `;

      inspector.innerHTML = formHtml;
      mobileContent.innerHTML = formHtml;
      renderCanvas();
    }

    function toggleInspectorSheet() {
      const sheet = document.getElementById('mobile-inspector-sheet');
      isSheetOpen = !isSheetOpen;
      sheet.classList.toggle('translate-y-full', !isSheetOpen);
    }

    function updateBlockStyle(id, prop, val) {
      const b = blocks.find(x => x.id === id);
      if (b) {
        b[prop] = val;
        renderCanvas();
      }
    }

    function moveBlock(index, offset, e) {
      e.stopPropagation();
      const target = index + offset;
      if (target < 0 || target >= blocks.length) return;
      const temp = blocks[index];
      blocks[index] = blocks[target];
      blocks[target] = temp;
      renderCanvas();
    }

    function deleteBlock(index, e) {
      e.stopPropagation();
      blocks.splice(index, 1);
      selectedBlockId = null;
      selectBlock(null);
    }

    function clearCanvas() {
      if (confirm('Clear all blocks?')) {
        blocks = [];
        selectedBlockId = null;
        selectBlock(null);
      }
    }

    function togglePreview() {
      isPreviewMode = !isPreviewMode;
      document.getElementById('section-menu-btn').style.display = isPreviewMode ? 'none' : 'flex';
      document.getElementById('preview-text').innerText = isPreviewMode ? 'Edit' : 'Preview';
      document.getElementById('preview-btn').classList.toggle('border-cyan-400', isPreviewMode);
      renderCanvas();
    }

    function openAiModal() { document.getElementById('ai-modal').classList.remove('hidden'); }
    function closeAiModal() { document.getElementById('ai-modal').classList.add('hidden'); }
    function setPromptPreset(text) { document.getElementById('ai-prompt').value = text; }

    function generateAiSite() {
      const prompt = document.getElementById('ai-prompt').value.trim() || 'Neon Cyber Hub';
      blocks = [
        { id: 's1', ...templates.navbar },
        {
          id: 's2',
          ...templates.hero,
          html: `
            <div class="max-w-xl mx-auto text-center space-y-4">
              <div class="inline-flex items-center space-x-1 px-3 py-1 rounded-full bg-cyan-950/60 border border-cyan-500/40 text-cyan-300 text-[10px]">
                <span>⚡ AI AUTO GENERATED</span>
              </div>
              <h1 class="text-3xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white via-cyan-200 to-purple-400" contenteditable="true">
                ${prompt.slice(0, 35).toUpperCase()}
              </h1>
              <p class="text-zinc-400 text-xs" contenteditable="true">Tailored dark aesthetic optimized for all mobile displays.</p>
              <div class="pt-2"><a href="#" class="px-6 py-2.5 rounded-lg bg-cyan-400 text-black font-extrabold text-xs" contenteditable="true">EXPLORE</a></div>
            </div>
          `
        },
        { id: 's3', ...templates.features },
        { id: 's4', ...templates.showcase },
        { id: 's5', ...templates.footer }
      ];
      renderCanvas();
      closeAiModal();
    }

    function exportCode() {
      blocks.forEach(b => {
        const el = document.getElementById(b.id);
        if (el) {
          const clone = el.cloneNode(true);
          const bar = clone.querySelector('.block-toolbar');
          if (bar) bar.remove();
          clone.classList.remove('selected');
          b.html = clone.innerHTML;
        }
      });

      const fullHtml = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA // LIVE SITE</title>
  <script src="https://cdn.tailwindcss.com"><\/script>
  <script src="https://unpkg.com/lucide@latest"><\/script>
</head>
<body class="bg-black text-zinc-100 font-sans antialiased">
${blocks.map(b => `  <section class="${b.bg} ${b.padding}">\n${b.html.trim()}\n  </section>`).join('\n\n')}
  <script>lucide.createIcons();<\/script>
</body>
</html>`;

      document.getElementById('exported-html-box').value = fullHtml;
      document.getElementById('export-modal').classList.remove('hidden');
    }

    function closeExportModal() { document.getElementById('export-modal').classList.add('hidden'); }
    function copyExportedCode() {
      const box = document.getElementById('exported-html-box');
      box.select();
      navigator.clipboard.writeText(box.value);
      const btn = document.getElementById('copy-btn');
      btn.innerText = 'Copied!';
      setTimeout(() => btn.innerText = 'Copy', 2000);
    }

    function downloadHtmlFile() {
      const content = document.getElementById('exported-html-box').value;
      const blob = new Blob([content], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'index.html';
      a.click();
    }

    window.onload = init;
  </script>
</body>
</html>
