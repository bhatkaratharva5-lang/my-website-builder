  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    /* Custom Neon Scrollbars */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #000000; }
    ::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #a855f7; box-shadow: 0 0 10px #a855f7; }

    /* Animated Cyber Neon Grid */
    .cyber-grid {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(6, 182, 212, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(168, 85, 247, 0.05) 1px, transparent 1px);
    }

    /* Ambient Pulsing Glow Animations */
    @keyframes neon-pulse {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.08); }
    }
    .neon-orb-cyan {
      animation: neon-pulse 7s ease-in-out infinite alternate;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.28) 0%, rgba(0,0,0,0) 70%);
      filter: blur(55px);
    }
    .neon-orb-purple {
      animation: neon-pulse 9s ease-in-out infinite alternate-reverse;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.28) 0%, rgba(0,0,0,0) 70%);
      filter: blur(60px);
    }

    /* Glassmorphism & Neon Borders */
    .glass-panel {
      background: rgba(7, 7, 12, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .neon-border-glow:hover {
      border-color: rgba(6, 182, 212, 0.8) !important;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.35), inset 0 0 10px rgba(6, 182, 212, 0.15);
    }

    /* Canvas Block States */
    .canvas-block {
      position: relative;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .canvas-block:hover {
      outline: 2px dashed #06b6d4;
      outline-offset: -2px;
      box-shadow: inset 0 0 25px rgba(6, 182, 212, 0.08);
    }
    .canvas-block.selected {
      outline: 2px solid #a855f7 !important;
      outline-offset: -2px;
      box-shadow: inset 0 0 35px rgba(168, 85, 247, 0.18), 0 0 25px rgba(168, 85, 247, 0.25) !important;
    }
    .block-toolbar {
      display: none;
      position: absolute;
      top: 10px;
      right: 12px;
      z-index: 50;
    }
    .canvas-block:hover .block-toolbar,
    .canvas-block.selected .block-toolbar {
      display: flex;
    }

    [contenteditable="true"]:focus {
      outline: 2px solid #06b6d4 !important;
      background: rgba(6, 182, 212, 0.08);
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
      border-radius: 6px;
    }
  </style>
</head>

    function insertSection(type) {
      const template = templates[type];
      if (!template) return;
      const id = 'sec_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
      blocks.push({ id, ...template });
      renderCanvas();
      selectBlock(id);
      
      // Auto close drawer after selection
      document.getElementById('section-drawer').classList.add('hidden');
      document.getElementById('section-chevron').style.transform = 'rotate(0deg)';

    function renderCanvas() {
      const canvas = document.getElementById('canvas');
      canvas.innerHTML = '';

      if (blocks.length === 0) {
        canvas.innerHTML = `
          <div class="py-28 text-center">
            <i data-lucide="layers" class="w-12 h-12 mx-auto text-zinc-700 mb-3 animate-pulse"></i>

          </div>
        `;
        lucide.createIcons();
        return;
      }

      blocks.forEach((block, index) => {
        const div = document.createElement('div');
        div.id = block.id;
        div.className = `canvas-block ${block.bg} ${block.padding} ${selectedBlockId === block.id && !isPreviewMode ? 'selected' : ''}`;
        div.onclick = (e) => {
          if (isPreviewMode) return;
          e.stopPropagation();
          selectBlock(block.id);
        };

        let toolbarHtml = '';
        if (!isPreviewMode) {
          toolbarHtml = `
            <div class="block-toolbar glass-panel rounded-xl shadow-2xl p-1 flex items-center space-x-1 border border-zinc-700">
              <button onclick="moveBlock(${index}, -1, event)" class="p-1 hover:bg-zinc-800 text-zinc-300 rounded" title="Move Up"><i data-lucide="chevron-up" class="w-3.5 h-3.5"></i></button>

            </div>
          `;
        }

        div.innerHTML = toolbarHtml + block.html;
        canvas.appendChild(div);
      });

      lucide.createIcons();

      selectedBlockId = id;

    function updateBlockStyle(id, prop, val) {
      const b = blocks.find(x => x.id === id);
      if (b) {
        b[prop] = val;
        renderCanvas();
      }
    }

    function moveBlock(index, offset, e) {
      e.stopPropagation();
      const target = index + offset;
      if (target < 0 || target >= blocks.length) return;
      const temp = blocks[index];
      blocks[index] = blocks[target];
      blocks[target] = temp;
      renderCanvas();
    }

    function duplicateBlock(index, e) {
      e.stopPropagation();
      const clone = JSON.parse(JSON.stringify(blocks[index]));
      clone.id = 'sec_' + Date.now();
      blocks.splice(index + 1, 0, clone);
      renderCanvas();
    }

    function deleteBlock(index, e) {
      e.stopPropagation();
      blocks.splice(index, 1);
      selectedBlockId = null;
      selectBlock(null);
    }

    function clearCanvas() {
      if (confirm('Wipe canvas clean?')) {
        blocks = [];
        selectedBlockId = null;
        selectBlock(null);
      }
    }
