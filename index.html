<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiquidGlass AI Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Liquid Glass styling */
    body {
      background: radial-gradient(circle at 20% 20%, #1e1b4b 0%, #09090b 50%, #020617 100%);
      color: #f8fafc;
      min-height: 100vh;
      overflow-y: auto;
      touch-action: auto;
    }
    .liquid-glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .liquid-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .liquid-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
      background: rgba(255, 255, 255, 0.06);
    }
    [contenteditable="true"]:focus {
      outline: 2px solid rgba(99, 102, 241, 0.7);
      background: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
    }
  </style>
</head>
<body class="font-sans antialiased pb-24">

  <!-- Sticky Liquid Glass Header -->
  <header class="sticky top-0 z-40 px-4 py-3 liquid-glass flex items-center justify-between border-b border-white/10">
    <!-- Top-Left Sections Dropdown -->
    <div class="relative">
      <button onclick="toggleMenu()" class="px-3 py-1.5 rounded-xl liquid-glass text-xs font-semibold text-indigo-300 flex items-center gap-1.5 active:scale-95 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        <span>Sections</span>
      </button>

      <!-- Dropdown Drawer -->
      <div id="section-menu" class="hidden absolute top-11 left-0 w-52 liquid-glass rounded-2xl p-2 z-50 flex flex-col gap-1 border border-white/15">
        <button onclick="addSection('hero')" class="w-full text-left p-2 rounded-lg hover:bg-white/10 text-xs font-medium text-slate-200">✨ Hero Banner</button>
        <button onclick="addSection('features')" class="w-full text-left p-2 rounded-lg hover:bg-white/10 text-xs font-medium text-slate-200">💎 Feature Cards</button>
        <button onclick="addSection('stats')" class="w-full text-left p-2 rounded-lg hover:bg-white/10 text-xs font-medium text-slate-200">📊 Stats / Counters</button>
        <button onclick="addSection('media')" class="w-full text-left p-2 rounded-lg hover:bg-white/10 text-xs font-medium text-slate-200">🎵 Media / Track Box</button>
        <button onclick="addSection('cta')" class="w-full text-left p-2 rounded-lg hover:bg-white/10 text-xs font-medium text-slate-200">🚀 Call to Action</button>
        <button onclick="addSection('footer')" class="w-full text-left p-2 rounded-lg hover:bg-white/10 text-xs font-medium text-slate-200">📄 Footer</button>
      </div>
    </div>

    <!-- Right Quick Actions -->
    <div class="flex items-center gap-2">
      <button onclick="openModal('ai-modal')" class="px-3 py-1.5 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 text-white text-xs font-semibold shadow-lg shadow-indigo-500/20 active:scale-95 transition flex items-center gap-1">
        <span>⚡ AI Builder</span>
      </button>
      <button onclick="exportSite()" class="px-3 py-1.5 rounded-xl liquid-glass text-xs font-semibold text-emerald-300 border-emerald-500/30 active:scale-95 transition">
        Export
      </button>
    </div>
  </header>

  <!-- Canvas Container (Natural scrolling) -->
  <main class="max-w-2xl mx-auto px-4 py-6 space-y-4">
    <div id="canvas" class="space-y-4">
      <!-- Generated Blocks Render Here -->
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-16 liquid-glass rounded-3xl p-6">
      <p class="text-sm font-medium text-slate-400">Canvas is currently empty.</p>
      <p class="text-xs text-slate-500 mt-1">Tap <b>AI Builder</b> or use the <b>Sections</b> menu to add content.</p>
    </div>
  </main>

  <!-- AI Generator Modal -->
  <div id="ai-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="w-full max-w-sm liquid-glass rounded-3xl p-5 border border-white/20 flex flex-col gap-3">
      <div class="flex justify-between items-center border-b border-white/10 pb-2">
        <h3 class="text-sm font-bold text-white flex items-center gap-1.5">
          <span>⚡</span> AI Prompt Builder
        </h3>
        <button onclick="closeModal('ai-modal')" class="text-slate-400 hover:text-white text-sm">✕</button>
      </div>

      <p class="text-xs text-slate-300">Describe what website you want to generate:</p>
      <textarea id="ai-prompt" rows="3" class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-400" placeholder="e.g. Neon gaming clan with live audio track and roster stats..."></textarea>

      <!-- Quick Concept Tags -->
      <div class="flex flex-wrap gap-1.5">
        <button onclick="setPrompt('Phonk music producer with beat tracks and social links')" class="px-2.5 py-1 rounded-lg liquid-glass text-[11px] text-indigo-300">🎧 Phonk Beatmaker</button>
        <button onclick="setPrompt('Esports competitive clan with stats and tournaments')" class="px-2.5 py-1 rounded-lg liquid-glass text-[11px] text-purple-300">🎮 Esports Clan</button>
        <button onclick="setPrompt('Dark modern streetwear fashion apparel drops')" class="px-2.5 py-1 rounded-lg liquid-glass text-[11px] text-pink-300">🔥 Streetwear Brand</button>
      </div>

      <div class="flex justify-end gap-2 pt-2 border-t border-white/10">
        <button onclick="closeModal('ai-modal')" class="px-3 py-1.5 rounded-xl text-xs text-slate-400">Cancel</button>
        <button onclick="runAiGenerator()" class="px-4 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs transition">Build Website</button>
      </div>
    </div>
  </div>

  <!-- Export Code Modal -->
  <div id="export-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="w-full max-w-sm liquid-glass rounded-3xl p-5 border border-white/20 flex flex-col gap-3">
      <div class="flex justify-between items-center border-b border-white/10 pb-2">
        <h3 class="text-sm font-bold text-emerald-300">Clean HTML Code</h3>
        <button onclick="closeModal('export-modal')" class="text-slate-400 hover:text-white text-sm">✕</button>
      </div>
      <p class="text-[11px] text-slate-400">Your site is compiled into a standalone HTML file ready for Cloudflare.</p>
      <textarea id="export-code" readonly class="w-full h-44 bg-black/50 border border-white/10 rounded-xl p-2.5 text-[10px] font-mono text-indigo-200 focus:outline-none"></textarea>
      <div class="flex justify-between gap-2 pt-1">
        <button onclick="copyCode()" id="copy-btn" class="px-3 py-1.5 rounded-xl liquid-glass text-xs text-white">Copy Code</button>
        <button onclick="downloadCode()" class="px-3 py-1.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-xs">Download HTML</button>
      </div>
    </div>
  </div>

  <!-- Main JavaScript App -->
  <script>
    let sections = [];

    // Built-in Templates
    const templates = {
      hero: (title = "Next-Gen Liquid Experience", desc = "Crafted with lightweight glassmorphism and instant touch response.") => ({
        type: 'hero',
        html: `
          <div class="liquid-glass rounded-3xl p-6 sm:p-8 text-center space-y-4">
            <span class="inline-block px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-[11px] font-medium tracking-wide">● LIQUID STUDIO</span>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight" contenteditable="true">${title}</h1>
            <p class="text-xs sm:text-sm text-slate-300 max-w-md mx-auto leading-relaxed" contenteditable="true">${desc}</p>
            <div class="pt-2 flex justify-center gap-3">
              <a href="#" class="px-5 py-2.5 rounded-2xl bg-indigo-600 text-white text-xs font-semibold hover:bg-indigo-500 transition shadow-lg shadow-indigo-600/30" contenteditable="true">Get Started</a>
              <a href="#" class="px-5 py-2.5 rounded-2xl liquid-glass text-slate-200 text-xs font-semibold" contenteditable="true">Explore</a>
            </div>
          </div>
        `
      }),
      features: (f1 = "Pure Speed", f2 = "Zero Lag", f3 = "Mobile Ready") => ({
        type: 'features',
        html: `
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div class="liquid-card rounded-2xl p-4 space-y-1.5">
              <span class="text-indigo-400 text-base">⚡</span>
              <h3 class="text-xs font-bold text-white" contenteditable="true">${f1}</h3>
              <p class="text-[11px] text-slate-400 leading-normal" contenteditable="true">Instant touch gestures with zero render delay.</p>
            </div>
            <div class="liquid-card rounded-2xl p-4 space-y-1.5">
              <span class="text-purple-400 text-base">💎</span>
              <h3 class="text-xs font-bold text-white" contenteditable="true">${f2}</h3>
              <p class="text-[11px] text-slate-400 leading-normal" contenteditable="true">Smooth glassmorphic blur without GPU stutter.</p>
            </div>
            <div class="liquid-card rounded-2xl p-4 space-y-1.5">
              <span class="text-pink-400 text-base">📱</span>
              <h3 class="text-xs font-bold text-white" contenteditable="true">${f3}</h3>
              <p class="text-[11px] text-slate-400 leading-normal" contenteditable="true">Optimized specifically for handheld devices.</p>
            </div>
          </div>
        `
      }),
      stats: () => ({
        type: 'stats',
        html: `
          <div class="liquid-glass rounded-2xl p-4 flex justify-around text-center">
            <div>
              <p class="text-lg font-black text-indigo-400" contenteditable="true">99.9%</p>
              <p class="text-[10px] text-slate-400 uppercase font-semibold" contenteditable="true">Uptime</p>
            </div>
            <div class="w-[1px] bg-white/10"></div>
            <div>
              <p class="text-lg font-black text-purple-400" contenteditable="true">100ms</p>
              <p class="text-[10px] text-slate-400 uppercase font-semibold" contenteditable="true">Speed</p>
            </div>
            <div class="w-[1px] bg-white/10"></div>
            <div>
              <p class="text-lg font-black text-pink-400" contenteditable="true">24/7</p>
              <p class="text-[10px] text-slate-400 uppercase font-semibold" contenteditable="true">Active</p>
            </div>
          </div>
        `
      }),
      media: (track = "Overdrive Phonk - 180 BPM") => ({
        type: 'media',
        html: `
          <div class="liquid-glass rounded-2xl p-4 flex items-center justify-between gap-3">
            <div class="space-y-0.5">
              <span class="text-[10px] text-indigo-400 font-mono tracking-wider">// AUDIO PLAYER</span>
              <h4 class="text-xs font-bold text-white" contenteditable="true">${track}</h4>
            </div>
            <div class="flex items-center gap-1.5 h-6 px-2.5 rounded-xl bg-white/5 border border-white/10">
              <span class="w-1 bg-indigo-400 h-3 animate-pulse rounded-full"></span>
              <span class="w-1 bg-indigo-400 h-5 animate-pulse rounded-full"></span>
              <span class="w-1 bg-purple-400 h-2 animate-pulse rounded-full"></span>
              <span class="w-1 bg-purple-400 h-4 animate-pulse rounded-full"></span>
            </div>
          </div>
        `
      }),
      cta: () => ({
        type: 'cta',
        html: `
          <div class="liquid-glass rounded-2xl p-5 text-center space-y-2 border border-indigo-500/30">
            <h3 class="text-sm font-bold text-white" contenteditable="true">Ready to Ship Your Vision?</h3>
            <p class="text-[11px] text-slate-400" contenteditable="true">Join other makers deploying simple, fast web tools.</p>
            <div class="pt-1">
              <a href="#" class="inline-block px-4 py-2 rounded-xl bg-indigo-600 text-white font-semibold text-xs" contenteditable="true">Join Today</a>
            </div>
          </div>
        `
      }),
      footer: () => ({
        type: 'footer',
        html: `
          <div class="liquid-card rounded-2xl p-4 text-center text-[10px] text-slate-500 font-mono" contenteditable="true">
            © 2026 LiquidGlass Studio. All Rights Reserved.
          </div>
        `
      })
    };

    function init() {
      sections = [
        templates.hero("Shatter Reality with Liquid Glass", "Smooth, responsive layout crafted with modern frosted blur layers."),
        templates.features("Zero Latency", "No Crash Loop", "Touch Gestures"),
        templates.media("Aura Drift Phonk - Bass Boost"),
        templates.footer()
      ];
      render();
    }

    function toggleMenu() {
      const menu = document.getElementById('section-menu');
      menu.classList.toggle('hidden');
    }

    // Close menu when clicking outside
    window.addEventListener('click', (e) => {
      const menu = document.getElementById('section-menu');
      if (!e.target.closest('#section-menu') && !e.target.closest('header button')) {
        menu.classList.add('hidden');
      }
    });

    function addSection(type) {
      if (templates[type]) {
        sections.push(templates[type]());
        render();
      }
      document.getElementById('section-menu').classList.add('hidden');
    }

    function removeSection(index) {
      sections.splice(index, 1);
      render();
    }

    function moveSection(index, dir) {
      const target = index + dir;
      if (target < 0 || target >= sections.length) return;
      const temp = sections[index];
      sections[index] = sections[target];
      sections[target] = temp;
      render();
    }

    function render() {
      const canvas = document.getElementById('canvas');
      const empty = document.getElementById('empty-state');
      canvas.innerHTML = '';

      if (sections.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      sections.forEach((sec, i) => {
        const wrap = document.createElement('div');
        wrap.className = 'relative group';

        // Lightweight control bar
        const controls = `
          <div class="absolute top-2 right-2 flex gap-1 z-10 bg-black/60 backdrop-blur rounded-lg p-1 border border-white/10 opacity-70 hover:opacity-100 transition">
            <button onclick="moveSection(${i}, -1)" class="px-1.5 py-0.5 text-[10px] text-slate-300 hover:text-white">▲</button>
            <button onclick="moveSection(${i}, 1)" class="px-1.5 py-0.5 text-[10px] text-slate-300 hover:text-white">▼</button>
            <button onclick="removeSection(${i})" class="px-1.5 py-0.5 text-[10px] text-rose-400 hover:text-rose-300">✕</button>
          </div>
        `;

        wrap.innerHTML = controls + sec.html;
        canvas.appendChild(wrap);
      });
    }

    // AI Generator Engine
    function setPrompt(val) {
      document.getElementById('ai-prompt').value = val;
    }

    function runAiGenerator() {
      const text = document.getElementById('ai-prompt').value.trim();
      if (!text) {
        alert("Please enter a short description!");
        return;
      }

      const lower = text.toLowerCase();
      let heroTitle = text.slice(0, 32);
      let f1 = "Ultra Speed", f2 = "Liquid Aesthetic", f3 = "Mobile Sync";
      let track = "Custom Theme Beat - 180 BPM";

      if (lower.includes("phonk") || lower.includes("music") || lower.includes("beat")) {
        heroTitle = "Phonk Drift & Bass Protocol";
        track = "Night Drive Phonk [Slowed + Reverb]";
        f1 = "High-Fidelity 808s";
        f2 = "Zero Latency Playback";
        f3 = "Streaming Access";
      } else if (lower.includes("esport") || lower.includes("clan") || lower.includes("game") || lower.includes("gaming")) {
        heroTitle = "Elite Clan Roster & Standings";
        f1 = "One-Tap Precision";
        f2 = "Verified Tourneys";
        f3 = "Rank Leaderboard";
      } else if (lower.includes("streetwear") || lower.includes("apparel") || lower.includes("store")) {
        heroTitle = "Exclusive Midnight Drop 001";
        f1 = "Heavyweight Fabric";
        f2 = "Worldwide Shipping";
        f3 = "Limited 100 Pieces";
      }

      // Rebuild layout tailored to the prompt
      sections = [
        templates.hero(heroTitle, `Designed based on prompt: "${text}"`),
        templates.features(f1, f2, f3),
        templates.stats(),
        templates.media(track),
        templates.cta(),
        templates.footer()
      ];

      closeModal('ai-modal');
      render();
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    // Clean Standalone HTML Export
    function exportSite() {
      // Sync edits inside contenteditable tags
      const blocks = document.querySelectorAll('#canvas > div');
      blocks.forEach((b, i) => {
        const clone = b.cloneNode(true);
        const controls = clone.querySelector('div');
        if (controls) controls.remove();
        if (sections[i]) sections[i].html = clone.innerHTML;
      });

      const fullCode = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Published with LiquidGlass</title>
  <script src="https://cdn.tailwindcss.com"><\/script>
  <style>
    body {
      background: radial-gradient(circle at 20% 20%, #1e1b4b 0%, #09090b 50%, #020617 100%);
      color: #f8fafc;
      min-height: 100vh;
    }
    .liquid-glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .liquid-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="p-4 sm:p-8 font-sans">
  <main class="max-w-2xl mx-auto space-y-4">
${sections.map(s => `    <div>\n${s.html.trim()}\n    </div>`).join('\n\n')}
  </main>
</body>
</html>`;

      document.getElementById('export-code').value = fullCode;
      openModal('export-modal');
    }

    function copyCode() {
      const box = document.getElementById('export-code');
      box.select();
      navigator.clipboard.writeText(box.value);
      const btn = document.getElementById('copy-btn');
      btn.innerText = 'Copied!';
      setTimeout(() => btn.innerText = 'Copy Code', 2000);
    }

    function downloadCode() {
      const blob = new Blob([document.getElementById('export-code').value], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'index.html';
      a.click();
    }

    window.onload = init;
  </script>
</body>
</html>
